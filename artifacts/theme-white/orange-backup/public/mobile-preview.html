<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mobile preview | Tayyabs.Designs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f2ede4;font:14px system-ui,sans-serif}header{padding:22px 24px;border-bottom:1px solid #f2ede426;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:18px;margin:0}p{color:#b6ab9f;font-size:12px;margin:7px 0 0}.controls{display:flex;gap:10px;flex-wrap:wrap}select,button{background:#201c18;color:#f2ede4;border:1px solid #f2ede42e;border-radius:12px;padding:12px;font:inherit}button{cursor:pointer}button:hover{border-color:#d96a3b}main{padding:28px 12px;display:grid;justify-items:center;gap:14px}.phone{width:390px;max-width:100%;height:820px;max-height:calc(100dvh - 190px);min-height:480px;border-radius:28px;overflow:hidden;border:1px solid #f2ede44d;box-shadow:0 25px 80px #0008;background:#101010}iframe{border:0;width:100%;height:100%;display:block}.size{font-size:11px;color:#d96a3b;letter-spacing:.1em;text-transform:uppercase}@media(max-width:600px){header{padding:16px}.phone{max-height:calc(100dvh - 230px)}select{font-size:13px}}
</style>
</head>
<body>
<header><div><h1>Tayyabs.Designs / Mobile preview</h1><p>Choose a page and phone width. Scroll and use the website inside the frame.</p></div><div class="controls"><select id="page" aria-label="Preview page"><option value="/">Home</option><option value="/work">Work</option><option value="/work/rebel-x-outfits-la-makan">Project details</option><option value="/brands">Brands</option><option value="/brands/aastan">Brand details</option><option value="/about">About</option><option value="/services">Services</option><option value="/contact">Contact</option></select><select id="width" aria-label="Phone width"><option>320</option><option>360</option><option selected>390</option><option>430</option></select><button id="reload" type="button">Refresh</button></div></header>
<main><span class="size" id="size">390 px / Live website</span><div class="phone" id="phone"><iframe id="site" src="/" title="Live mobile website preview"></iframe></div></main>
<script>
const site=document.getElementById('site');
document.getElementById('page').addEventListener('change',e=>{site.src=e.target.value});
document.getElementById('width').addEventListener('change',e=>{document.getElementById('phone').style.width=e.target.value+'px';document.getElementById('size').textContent=e.target.value+' px / Live website'});
document.getElementById('reload').addEventListener('click',()=>{site.src=site.src});
</script>
</body></html>
